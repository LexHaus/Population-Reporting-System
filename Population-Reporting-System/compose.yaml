
services:
  database:
    image: mysql:8.4
    container_name: world-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      MYSQL_DATABASE: world
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -uroot world -e 'SELECT 1 FROM country LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "3306:3306"
    volumes:
      - world-data:/var/lib/mysql
      - ./database/world.sql:/docker-entrypoint-initdb.d/world.sql:ro

  app:
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: world
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}

volumes:
  world-data: