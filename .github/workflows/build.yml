name: Build and test

on:
  push:
    branches-ignore:
      - coverage-badges
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Population-Reporting-System
    env:
      # Disposable CI database only; this is not a production credential.
      DB_PASSWORD: ci-world-test-password
      DB_USER: root
      WORLD_TEST_URL: jdbc:mysql://127.0.0.1:3306/world
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Population-Reporting-System/pom.xml
      - name: Test language calculations
        working-directory: .
        run: python3 -m unittest discover -s tests/languages -v
      - name: Start and initialise World database
        run: docker compose up -d --wait --wait-timeout 240 database
      - name: Build JAR and run unit and JDBC integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Summarise Java coverage
        run: |
          python3 - <<'PYCODE'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          language = root.find(".//class[@name='org/example/LanguageReport']")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Java test coverage\n\n| Scope | Lines | Branches |\n|---|---:|---:|\n')
              for name, scope in [('All Java classes', root), ('LanguageReport', language)]:
                  values = []
                  for kind in ['LINE', 'BRANCH']:
                      counter = scope.find(f"counter[@type='{kind}']")
                      covered, missed = int(counter.get('covered')), int(counter.get('missed'))
                      total = covered + missed
                      values.append(f'{covered / total:.1%} ({covered}/{total})' if total else 'N/A')
                  summary.write(f'| {name} | {values[0]} | {values[1]} |\n')
              summary.write('\nDownload build-and-test-evidence for the full HTML/XML report. Python tests are separate.\n')
          PYCODE
      - name: Build Docker image using default Dockerfile name
        run: docker build --tag population-reporting-system:ci .
      - name: Run all 32 report requirements in Docker
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: world
        run: python3 ../.github/scripts/report_smoke.py --image population-reporting-system:ci --output target/report-evidence
      - name: Upload JAR, test results and report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-evidence
          path: |
            Population-Reporting-System/target/Population-Reporting-System-1.0-SNAPSHOT.jar
            Population-Reporting-System/target/surefire-reports/
            Population-Reporting-System/target/site/jacoco/
            Population-Reporting-System/target/report-evidence/
          if-no-files-found: warn
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs database
      - name: Clean up CI database
        if: always()
        run: docker compose down --volumes

  publish-coverage:
    name: Publish master coverage badge
    needs: verify
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: master-coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download verified coverage report
        uses: actions/download-artifact@v4
        with:
          name: build-and-test-evidence
          path: ${{ runner.temp }}/coverage-evidence
      - name: Generate badge from measured Java coverage
        env:
          EVIDENCE: ${{ runner.temp }}/coverage-evidence
          BADGE_OUTPUT: ${{ runner.temp }}/coverage-badge
        run: |
          mapfile -t reports < <(find "$EVIDENCE" -name jacoco.xml -type f)
          test "${#reports[@]}" -eq 1
          python3 .github/scripts/coverage_badge.py "${reports[0]}" "$BADGE_OUTPUT" --commit "$GITHUB_SHA"
      - name: Publish badge data
        env:
          BADGE_OUTPUT: ${{ runner.temp }}/coverage-badge
        run: |
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
            echo "A newer master commit exists; leaving publication to its build."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin coverage-badges; then
            git fetch origin coverage-badges
            git switch --force-create coverage-badges origin/coverage-badges
          else
            git switch --orphan coverage-badges
          fi
          cp "$BADGE_OUTPUT/"* .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.json master-source.json jacoco.xml
          if git diff --cached --quiet; then
            echo "Coverage badge data is already current."
          else
            git commit -m "Update master coverage badge"
            git push origin HEAD:coverage-badges
          fi
